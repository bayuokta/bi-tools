name: Web smoke

# Smoke test browser (Playwright) untuk web/ dan server/. Dipisah dari CI utama
# supaya job `test` tetap ringan dan tidak perlu memasang Chromium.
on:
  pull_request:
    paths:
      - "web/**"
      - "server/**"
      - "tests/test_web_smoke.py"
      - ".github/workflows/web-smoke.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "server/**"
      - "tests/test_web_smoke.py"
      - ".github/workflows/web-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instal dependensi
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install playwright

      - name: Unduh Chromium
        run: python -m playwright install chromium

      - name: Smoke test browser
        env:
          RUN_WEB_SMOKE: "1"
        run: python -m unittest tests.test_web_smoke -v
